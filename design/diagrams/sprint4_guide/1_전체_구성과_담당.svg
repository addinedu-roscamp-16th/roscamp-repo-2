<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="692" viewBox="0 0 1100 692" font-family="NanumSquare, 'Noto Sans CJK KR', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1100" height="692" fill="#ffffff"/><text x="24" y="38" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">누가 무엇을 맡나요</text><rect x="20" y="60" width="1060" height="190" rx="16" fill="#e8f1fd" stroke="#2f6fd0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="36" y="86" font-size="15" font-weight="bold" fill="#163f80" text-anchor="start">주문 처리 담당</text><rect x="45" y="110" width="215" height="100" rx="12" fill="#fff" stroke="#2f6fd0" stroke-width="2.5"/><text x="152.5" y="156.0" font-size="19" font-weight="bold" fill="#163f80" text-anchor="middle">고객 · 관리자 화면</text><text x="152.5" y="180.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">주문하고 진행 보기</text><rect x="310" y="110" width="215" height="100" rx="12" fill="#fff" stroke="#2f6fd0" stroke-width="2.5"/><text x="417.5" y="156.0" font-size="19" font-weight="bold" fill="#163f80" text-anchor="middle">웹 서버 · DB</text><text x="417.5" y="180.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">주문 저장, 화면에 알림</text><rect x="575" y="110" width="215" height="100" rx="12" fill="#fff" stroke="#2f6fd0" stroke-width="2.5"/><text x="682.5" y="156.0" font-size="19" font-weight="bold" fill="#163f80" text-anchor="middle">브리지</text><text x="682.5" y="180.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">웹과 로봇 쪽을 이어 줌</text><rect x="840" y="110" width="215" height="100" rx="12" fill="#fff" stroke="#2f6fd0" stroke-width="2.5"/><text x="947.5" y="156.0" font-size="19" font-weight="bold" fill="#163f80" text-anchor="middle">central</text><text x="947.5" y="180.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">할 일 목록(주문판) 관리</text><line x1="260" y1="160" x2="308" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="284.0" y="150" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">주문</text><line x1="525" y1="160" x2="573" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="790" y1="160" x2="838" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="814.0" y="150" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">넘기기</text><rect x="20" y="290" width="1060" height="140" rx="16" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5" stroke-dasharray="6 4"/><text x="36" y="316" font-size="15" font-weight="bold" fill="#165c30" text-anchor="start">관제 담당</text><rect x="380" y="330" width="440" height="80" rx="12" fill="#fff" stroke="#2e9a55" stroke-width="2.5"/><text x="600.0" y="366.0" font-size="19" font-weight="bold" fill="#165c30" text-anchor="middle">fleet (관제)</text><text x="600.0" y="390.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">어느 로봇이 언제 무엇을 할지 정함</text><line x1="930" y1="212" x2="760" y2="328" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="905" y="275" font-size="14" font-weight="bold" fill="#374151" text-anchor="start">① 할 일 목록</text><line x1="470" y1="328" x2="650" y2="212" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="500" y="275" font-size="14" font-weight="bold" fill="#374151" text-anchor="end">② 진행 보고</text><rect x="20" y="470" width="340" height="170" rx="16" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5" stroke-dasharray="6 4"/><text x="36" y="496" font-size="15" font-weight="bold" fill="#165c30" text-anchor="start">관제 담당</text><rect x="380" y="470" width="340" height="170" rx="16" fill="#fdf0e2" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="396" y="496" font-size="15" font-weight="bold" fill="#7a4210" text-anchor="start">양팔 담당</text><rect x="740" y="470" width="340" height="170" rx="16" fill="#f1eafb" stroke="#8256c9" stroke-width="1.5" stroke-dasharray="6 4"/><text x="756" y="496" font-size="15" font-weight="bold" fill="#45247d" text-anchor="start">출고 담당</text><rect x="60" y="520" width="260" height="90" rx="12" fill="#fff" stroke="#2e9a55" stroke-width="2.5" stroke-dasharray="7 5"/><text x="190.0" y="561.0" font-size="19" font-weight="bold" fill="#165c30" text-anchor="middle">Pode 3대</text><text x="190.0" y="585.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">바구니를 싣고 다니는 운반 로봇</text><rect x="420" y="520" width="260" height="90" rx="12" fill="#fff" stroke="#d9822b" stroke-width="2.5" stroke-dasharray="7 5"/><text x="550.0" y="561.0" font-size="19" font-weight="bold" fill="#7a4210" text-anchor="middle">Phody (양팔)</text><text x="550.0" y="585.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">바구니에 상품을 담음</text><rect x="780" y="520" width="260" height="90" rx="12" fill="#fff" stroke="#8256c9" stroke-width="2.5" stroke-dasharray="7 5"/><text x="910.0" y="561.0" font-size="19" font-weight="bold" fill="#45247d" text-anchor="middle">Phony (출고)</text><text x="910.0" y="585.0" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="middle">찬 바구니를 내보냄</text><line x1="470" y1="412" x2="190" y2="518" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="600" y1="412" x2="550" y2="518" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="730" y1="412" x2="910" y2="518" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="40" y="458" font-size="14" font-weight="bold" fill="#374151" text-anchor="start">로봇에게 지시 · 로봇 상태 받기</text><text x="24" y="672" font-size="15" font-weight="normal" fill="#4b5563" text-anchor="start">점선 로봇: 이번 주에는 가짜 로봇(시뮬레이션)으로 흐름을 확인하고, 다음 주에 실제 로봇으로 바꿉니다.</text></svg>