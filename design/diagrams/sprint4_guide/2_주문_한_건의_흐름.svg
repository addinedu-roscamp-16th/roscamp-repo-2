<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="648" viewBox="0 0 1100 648" font-family="NanumSquare, 'Noto Sans CJK KR', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1100" height="648" fill="#ffffff"/><text x="24" y="38" font-size="22" font-weight="bold" fill="#111827" text-anchor="start">주문 한 건은 이렇게 흘러갑니다</text><text x="70" y="88" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="start">단계</text><text x="380" y="88" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="start">누가</text><text x="800" y="88" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="start">고객 화면</text><rect x="20" y="110" width="1060" height="64" rx="12" fill="#ffffff" stroke="#e5e7eb"/><circle cx="48" cy="142" r="17" fill="#111827"/><text x="48" y="148" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="78" y="138" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">주문 넣기</text><text x="78" y="162" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">고객이 화면에서 주문하면 웹이 DB에 저장</text><rect x="500" y="128" width="64" height="28" rx="14" fill="#e8f1fd" stroke="#2f6fd0" stroke-width="1.5"/><text x="532.0" y="147" font-size="14" font-weight="bold" fill="#163f80" text-anchor="middle">주문</text><rect x="800" y="128" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="147" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">접수됨</text><line x1="48" y1="160" x2="48" y2="198" stroke="#9ca3af" stroke-width="2"/><rect x="20" y="184" width="1060" height="64" rx="12" fill="#fafafa" stroke="#e5e7eb"/><circle cx="48" cy="216" r="17" fill="#111827"/><text x="48" y="222" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="78" y="212" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">로봇 쪽으로 넘기기</text><text x="78" y="236" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">브리지가 주문(바구니 단위)을 central에 전달</text><rect x="500" y="202" width="64" height="28" rx="14" fill="#e8f1fd" stroke="#2f6fd0" stroke-width="1.5"/><text x="532.0" y="221" font-size="14" font-weight="bold" fill="#163f80" text-anchor="middle">주문</text><rect x="800" y="202" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="221" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">접수됨</text><line x1="48" y1="234" x2="48" y2="272" stroke="#9ca3af" stroke-width="2"/><rect x="20" y="258" width="1060" height="64" rx="12" fill="#ffffff" stroke="#e5e7eb"/><circle cx="48" cy="290" r="17" fill="#111827"/><text x="48" y="296" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="78" y="286" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">할 일 목록에 올리기</text><text x="78" y="310" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">central이 목록을 fleet에 보냄, 들어온 순서대로</text><rect x="500" y="276" width="64" height="28" rx="14" fill="#e8f1fd" stroke="#2f6fd0" stroke-width="1.5"/><text x="532.0" y="295" font-size="14" font-weight="bold" fill="#163f80" text-anchor="middle">주문</text><rect x="574" y="276" width="64" height="28" rx="14" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5"/><text x="606.0" y="295" font-size="14" font-weight="bold" fill="#165c30" text-anchor="middle">관제</text><rect x="800" y="276" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="295" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">접수됨</text><line x1="48" y1="308" x2="48" y2="346" stroke="#9ca3af" stroke-width="2"/><rect x="20" y="332" width="1060" height="64" rx="12" fill="#fafafa" stroke="#e5e7eb"/><circle cx="48" cy="364" r="17" fill="#111827"/><text x="48" y="370" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="78" y="360" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">로봇 배정 · 상품 담기</text><text x="78" y="384" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">fleet이 Pode를 작업대로 보내고 Phody가 상품을 담음</text><rect x="500" y="350" width="64" height="28" rx="14" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5"/><text x="532.0" y="369" font-size="14" font-weight="bold" fill="#165c30" text-anchor="middle">관제</text><rect x="574" y="350" width="64" height="28" rx="14" fill="#fdf0e2" stroke="#d9822b" stroke-width="1.5"/><text x="606.0" y="369" font-size="14" font-weight="bold" fill="#7a4210" text-anchor="middle">양팔</text><rect x="800" y="350" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="369" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">준비 중</text><line x1="48" y1="382" x2="48" y2="420" stroke="#9ca3af" stroke-width="2"/><rect x="20" y="406" width="1060" height="64" rx="12" fill="#ffffff" stroke="#e5e7eb"/><circle cx="48" cy="438" r="17" fill="#111827"/><text x="48" y="444" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="78" y="434" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">출고로 운반</text><text x="78" y="458" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">다 담은 바구니를 Pode가 출고 쪽으로 옮김</text><rect x="500" y="424" width="64" height="28" rx="14" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5"/><text x="532.0" y="443" font-size="14" font-weight="bold" fill="#165c30" text-anchor="middle">관제</text><rect x="800" y="424" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="443" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">출고 중</text><line x1="48" y1="456" x2="48" y2="494" stroke="#9ca3af" stroke-width="2"/><rect x="20" y="480" width="1060" height="64" rx="12" fill="#fafafa" stroke="#e5e7eb"/><circle cx="48" cy="512" r="17" fill="#111827"/><text x="48" y="518" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="78" y="508" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">바구니 내보내기</text><text x="78" y="532" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">Phony가 찬 바구니를 빼서 내보냄</text><rect x="500" y="498" width="64" height="28" rx="14" fill="#f1eafb" stroke="#8256c9" stroke-width="1.5"/><text x="532.0" y="517" font-size="14" font-weight="bold" fill="#45247d" text-anchor="middle">출고</text><rect x="800" y="498" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="517" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">출고 완료</text><line x1="48" y1="530" x2="48" y2="568" stroke="#9ca3af" stroke-width="2"/><rect x="20" y="554" width="1060" height="64" rx="12" fill="#ffffff" stroke="#e5e7eb"/><circle cx="48" cy="586" r="17" fill="#111827"/><text x="48" y="592" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="78" y="582" font-size="18" font-weight="bold" fill="#111827" text-anchor="start">목록에서 빼기</text><text x="78" y="606" font-size="14" font-weight="normal" fill="#4b5563" text-anchor="start">fleet이 끝났다고 알리면 central이 목록에서 뺌</text><rect x="500" y="572" width="64" height="28" rx="14" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5"/><text x="532.0" y="591" font-size="14" font-weight="bold" fill="#165c30" text-anchor="middle">관제</text><rect x="574" y="572" width="64" height="28" rx="14" fill="#e8f1fd" stroke="#2f6fd0" stroke-width="1.5"/><text x="606.0" y="591" font-size="14" font-weight="bold" fill="#163f80" text-anchor="middle">주문</text><rect x="800" y="572" width="120" height="28" rx="14" fill="#f3f4f6" stroke="#9aa0a8" stroke-width="1.5"/><text x="860.0" y="591" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">출고 완료</text><rect x="945" y="332" width="125" height="212" rx="12" fill="#e6f6ec" stroke="#2e9a55" stroke-width="1.5"/><text x="1007" y="382" font-size="14" font-weight="normal" fill="#165c30" text-anchor="middle">단계가 바뀔</text><text x="1007" y="408" font-size="14" font-weight="normal" fill="#165c30" text-anchor="middle">때마다 fleet이</text><text x="1007" y="434" font-size="14" font-weight="bold" fill="#165c30" text-anchor="middle">진행 보고</text><text x="1007" y="460" font-size="14" font-weight="normal" fill="#165c30" text-anchor="middle">→ 화면이</text><text x="1007" y="486" font-size="14" font-weight="normal" fill="#165c30" text-anchor="middle">바로 바뀜</text></svg>