eight="bold" fill="#2e9a55" text-anchor="middle">T-02</text><text x="24" y="425" font-size="14" font-weight="normal" fill="#374151" text-anchor="start">T-03 주문판 전달 · T-07 배정 알림 · T-08 배정 조회 · T-09 (예외) 바구니 용량(4개) 넘는 주문은 경고만, 다른 주문은 배정</text><line x1="24" y1="460" x2="68" y2="460" stroke="#2e9a55" stroke-width="3"/><text x="78" y="465" font-size="15" font-weight="bold" fill="#2e9a55" text-anchor="start">성공</text><line x1="144" y1="460" x2="188" y2="460" stroke="#d9822b" stroke-width="3"/><text x="198" y="465" font-size="15" font-weight="bold" fill="#d9822b" text-anchor="start">보류</text><text x="264" y="465" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="start">이번 범위 밖: 상품 담기 · 출고 · 실제 로봇 주행</text></svg>